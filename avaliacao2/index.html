<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Space Invaders</title>
</head>
<body onload="initGame()">
  <main>
    <div class="stats">
      <div class="statsleft">
        <img class="statsimg" src="images/clock.png" alt="clock" />
        <img class="statsimg" src="images/nave.png" alt="ship" />
        <img class="statsimg" src="images/alien.png" alt="alien" />
      </div>
      <div class="statsright">
        <span><div id="timer">00:00:00</div></span>
        <span id="life">LIFE: 3</span>
        <span id="aliens">ALIEN: 0</span>
      </div>
    </div>

    <div id="message"></div>

    <div id="player">
      <span class="rocketObj left"><img class="rocket" src="images/missil.png" /></span>
      <img class="playerimg" src="images/nave.png" />
      <span class="rocketObj right"><img class="rocket" src="images/missil.png" /></span>
    </div>

    <div id="enemies" class="enemies-container"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
