<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="imagens/cavalo.png" type="image/x-icon">
    <link rel="stylesheet" href="css/game.css">
    <title>Memory Game</title>
</head>

<body>
    <h1>PLAY NOW!</h1>

    <div class="displaycards">
        <div class="cards">
            <img class="cover" src="imagens/heisenberg.png" alt="Imagem de Walter White" onclick="showHide(this);">
        </div>
        <div class="cards">
            <img class="cover" src="imagens/gus.jpeg" alt="Imagem de Gus Fring" onclick="showHide(this);">
        </div>
        <div class="cards">
            <img class="cover" src="imagens/skyler.jpg" alt="Imagem de Skyler White" onclick="showHide(this);">
        </div>
        <div class="cards">
            <img class="cover" src="imagens/mike.jpg" alt="Imagem de Mike Ehrmantraut" onclick="showHide(this);">
        </div>
    </div>
    <div class="displaycards">
        <div class="cards">
            <img class="cover" src="imagens/jesse.jpg" alt="Imagem de Jesse Pinkman" onclick="showHide(this);">
        </div>
        <div class="cards">
            <img class="cover" src="imagens/saul.jpg" alt="Imagem de Saul Goodman" onclick="showHide(this);">
        </div>
        <div class="cards">
            <img class="cover" src="imagens/hank.jpeg" alt="Imagem de Hank Schrader" onclick="showHide(this);">
        </div>
        <div class="cards">
            <img class="cover" src="imagens/jane.jpeg" alt="Imagem de Jane Margolis" onclick="showHide(this);" onclick="showHide(this);">
        </div>
    </div>

</body>
</html>
<script type="text/javascript">

    function showHide(card){

        if(card.style.opacity == 0){
            card.style.opacity = 1
        }
        else{
            card.style.opacity = 0
        }
    }
</script>
