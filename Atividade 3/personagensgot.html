<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/game.css">
    <title>Memory Game</title>
</head>

<body>
    <h1>PLAY NOW</h1>

    <div class="displaycards">
        <div class="cards">
            <img class="cover" src="imagens/tyrion.jpg" alt="Imagem de Tyrion Lannister" onclick="showHide(this);">
        </div>
        <div class="cards">
            <img class="cover" src="imagens/ned.jpg" alt="Imagem de Ned Stark" onclick="showHide(this);">
        </div>
        <div class="cards">
            <img class="cover" src="imagens/daenerys.jpg" alt="Imagem de Daenerys Targaryen" onclick="showHide(this);">
        </div>
        <div class="cards">
            <img class="cover" src="imagens/tywin.jpeg" alt="Imagem de Tywin Lannister" onclick="showHide(this);">
        </div>
    </div>
    <div class="displaycards">
        <div class="cards">
            <img class="cover" src="imagens/oberyn.jpg" alt="Imagem de Oberyn Martell" onclick="showHide(this);">
        </div>
        <div class="cards">
            <img class="cover" src="imagens/melisandre.jpg" alt="Imagem de Melisandre de Ashay" onclick="showHide(this);">
        </div>
        <div class="cards">
            <img class="cover" src="imagens/jon.jpg" alt="Imagem de Jon Snow" onclick="showHide(this);">
        </div>
        <div class="cards">
            <img class="cover" src="imagens/stannis.jpg" alt="Imagem de Stannis Baratheon" onclick="showHide(this);">
        </div>
    </div>

</body>
</html>
<script type="text/javascript">

    function showHide(card){

        if(card.style.opacity == 0){
            card.style.opacity = 1
        }
        else{
            card.style.opacity = 0
        }
    }
</script>
