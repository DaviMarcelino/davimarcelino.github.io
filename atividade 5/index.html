<html class="h-full bg-white" lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <link rel="shortcut icon" href="ckan-logo.png" type="image/x-icon">
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Login - Instituto Federal Paraná
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
 </head>
 <body class="h-full">
  <main class="flex h-full min-h-screen flex-col md:flex-row">
   <section class="flex flex-col justify-center px-8 sm:px-16 py-16 w-full md:w-1/2 max-w-lg mx-auto">
    <h1 class="text-4xl font-normal text-gray-800 mb-4">
     Login
    </h1>
    <p class="text-lg text-gray-600 mb-12">
     Faça o login para continuar
    </p>
    <form class="flex flex-col space-y-10">
     <input class="border-b border-gray-300 focus:outline-none focus:border-gray-500 text-gray-700 text-lg pb-3" placeholder="E-mail" required="" type="email"/>
     <input class="border-b border-gray-300 focus:outline-none focus:border-gray-500 text-gray-700 text-lg pb-3" placeholder="Senha" required="" type="password"/>
     <div class="flex items-center space-x-10">
      <button class="bg-red-600 text-white text-lg px-6 py-2 rounded-sm hover:bg-red-700 transition" type="submit">
       Logar
      </button>
      <a class="text-gray-500 text-base hover:underline" href="#">
       Esqueceu a senha
      </a>
     </div>
    </form>
    <hr class="my-12 border-gray-300"/>
    <div class="flex space-x-6">
     <a aria-label="Facebook" class="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center text-white text-xl hover:bg-blue-700 transition" href="#">
      <i class="fab fa-facebook-f">
      </i>
     </a>
     <a aria-label="Google" class="w-12 h-12 rounded-full bg-red-600 flex items-center justify-center text-white text-xl hover:bg-red-700 transition" href="#">
      <i class="fab fa-google">
      </i>
     </a>
     <a aria-label="Twitter" class="w-12 h-12 rounded-full bg-cyan-400 flex items-center justify-center text-white text-xl hover:bg-cyan-500 transition" href="#">
      <i class="fab fa-twitter">
      </i>
     </a>
     <a aria-label="LinkedIn" class="w-12 h-12 rounded-full bg-blue-700 flex items-center justify-center text-white text-xl hover:bg-blue-800 transition" href="#">
      <i class="fab fa-linkedin-in">
      </i>
     </a>
    </div>
   </section>
   <section class="hidden md:block w-full md:w-1/2 bg-[#1565C0]">
    <img alt="logo IFPR campus Paranaguá" class="object-cover w-full h-full" src="logo_ifpr.jpg"/>
   </section>
  </main>
 </body>
</html
