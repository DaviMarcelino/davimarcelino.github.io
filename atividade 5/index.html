<html lang="pt-BR" class="h-100 bg-white">
<head>
  <meta charset="utf-8" />
  <link rel="shortcut icon" href="ckan-logo.png" type="image/x-icon" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Instituto Federal Paraná</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
  <style>
    body, html {
      height: 100%;
      background-color: white;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .input-custom {
      border: none;
      border-bottom: 1px solid #d1d5db;
      padding-bottom: 0.75rem;
      font-size: 1.125rem; 
      color: #374151; 
      outline: none;
      transition: border-color 0.2s ease;
      width: 100%;
    }
    .input-custom:focus {
      border-bottom-color: #6b7280;
      box-shadow: none;
    }
    .btn-red {
      background-color: #dc2626; 
      color: white;
      font-size: 1.125rem; 
      padding: 0.5rem 1.5rem;
      border-radius: 0.125rem; 
      transition: background-color 0.2s ease;
      border: none;
    }
    .btn-red:hover, .btn-red:focus {
      background-color: #b91c1c; 
      color: white;
    }
    a.text-gray {
      color: #6b7280; 
      font-size: 1rem; 
      text-decoration: none;
      transition: text-decoration 0.2s ease;
    }
    a.text-gray:hover, a.text-gray:focus {
      text-decoration: underline;
      color: #6b7280;
    }
    .social-btn {
      width: 3rem; 
      height: 3rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.25rem; 
      transition: background-color 0.2s ease;
      text-decoration: none;
    }
    .social-facebook {
      background-color: #2563eb; 
    }
    .social-facebook:hover, .social-facebook:focus {
      background-color: #1d4ed8; 
      color: white;
    }
    .social-google {
      background-color: #dc2626; 
    }
    .social-google:hover, .social-google:focus {
      background-color: #b91c1c; 
      color: white;
    }
    .social-twitter {
      background-color: #22d3ee; 
    }
    .social-twitter:hover, .social-twitter:focus {
      background-color: #06b6d4; 
      color: white;
    }
    .social-linkedin {
      background-color: #1e40af; 
    }
    .social-linkedin:hover, .social-linkedin:focus {
      background-color: #1e3a8a; 
      color: white;
    }
    main > section:first-child {
      max-width: 28rem; 
    }
    @media (min-width: 768px) {
      main {
        flex-direction: row !important;
        height: 100vh;
      }
      main > section:first-child {
        width: 50%;
        max-width: none;
        margin-left: auto;
        margin-right: 0;
        padding-left: 4rem; 
        padding-right: 4rem;
        padding-top: 4rem;
        padding-bottom: 4rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      main > section:last-child {
        display: block !important;
        width: 50%;
        background-color: #1565C0;
        height: 100vh;
      }
    }
    @media (max-width: 767.98px) {
      main {
        flex-direction: column !important;
        min-height: 100vh;
      }
      main > section:first-child {
        width: 100%;
        padding-left: 2rem; 
        padding-right: 2rem;
        padding-top: 4rem;
        padding-bottom : 4rem;
        max-width: 100%;
        margin-left: auto;
        margin-right: auto;
      }
      main > section:last-child {
        display: none !important;
      }
    }
    img.object-cover {
      object-fit: cover;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body class="h-100">
  <main class="d-flex flex-column flex-md-row h-100 min-vh-100">
    <section>
      <h1 class="mb-4" style="font-weight: 400; font-size: 2.25rem; color: #1f2937;">Login</h1>
      <p class="mb-5" style="font-size: 1.125rem; color: #4b5563;">Faça o login para continuar</p>
      <form class="d-flex flex-column gap-5">
        <input type="email" placeholder="E-mail" required class="input-custom" />
        <input type="password" placeholder="Senha" required class="input-custom" />
        <div class="d-flex align-items-center gap-4">
          <button type="submit" class="btn-red">Logar</button>
          <a href="#" class="text-gray">Esqueceu a senha</a>
        </div>
      </form>
      <hr class="my-5" style="border-color: #d1d5db;" />
      <div class="d-flex gap-3">
        <a href="#" aria-label="Facebook" class="social-btn social-facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="#" aria-label="Google" class="social-btn social-google"><i class="fab fa-google"></i></a>
        <a href="#" aria-label="Twitter" class="social-btn social-twitter"><i class="fab fa-twitter"></i></a>
        <a href="#" aria-label="LinkedIn" class="social-btn social-linkedin"><i class="fab fa-linkedin-in"></i></a>
      </div>
    </section>
    <section class="d-none d-md-block">
      <img src="logo_ifpr.jpg" alt="logo IFPR campus Paranaguá" class="object-cover" />
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
